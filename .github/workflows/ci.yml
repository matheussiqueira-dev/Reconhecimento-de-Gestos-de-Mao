name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Production dependencies must be clean. Dev-only advisories without a fix are
      # documented in docs/SECURITY.md.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  python:
    name: Python rules (3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: python/.python-version
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: sh scripts/check.sh

  python-runtime:
    name: Python runtime smoke test (3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: python/.python-version
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgles2 libglib2.0-0
      - run: pip install -r requirements.txt
      - run: pip check
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt --strict
      - run: python -m hand_gestures.model
      # Initialises Tasks on a blank frame without opening a camera.
      - run: python -m hand_gestures --self-check
